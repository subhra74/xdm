<!DOCTYPE html>
<!--
  Replaces the 2023 build in github.com/subhra74/xdm-translation-app (served at
  subhra74.github.io/xdm-translation-app/). The generator now lives in the xdm repo and is
  deployed by .github/workflows/pages.yml to subhra74.github.io/xdm/translate/.
  That repo serves Pages from main:/docs, so this file is docs/index.html there, and docs/404.html
  (the same file) catches deep links.
-->
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="refresh" content="0;url=https://subhra74.github.io/xdm/translate/" />
	<link rel="canonical" href="https://subhra74.github.io/xdm/translate/" />
	<title>XDM Translator has moved</title>
	<script>
		window.location.replace("https://subhra74.github.io/xdm/translate/");
	</script>
</head>

<body>
	The XDM translator has moved to
	<a href="https://subhra74.github.io/xdm/translate/">subhra74.github.io/xdm/translate/</a>.
	Most translators now use <a href="https://hosted.weblate.org/projects/xdm/">Weblate</a>.
</body>

</html>
