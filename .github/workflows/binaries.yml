name: Binaries

# The installers for every target in PACKAGING.md section 3.1, each built natively on its own runner. The jar is
# built once and shared. Every target links its runtime from the JDK pinned in packaging/jdk.properties, which
# the build scripts enforce; the AppCDS archive is dumped from the checked-in class list (packaging/cds), so no
# job needs a desktop session. A target without a list builds without an archive.

# A tag push (v*) publishes a GitHub release with every installer; a tag with a suffix (v9.0.1-beta.1) is
# marked pre-release. A manual run only uploads the run's artifacts unless "release" is ticked; it then tags the
# commit (the "tag" input, or v<app-version.json version>-pre.<run number>) and publishes a pre-release unless
# "prerelease" is cleared. The macOS jobs may fail without blocking the release: their dmgs can be added to it
# by hand.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release from this run
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
      tag:
        description: Release tag (empty = v<app version>-pre.<run number>)
        type: string
        default: ''
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The root pom selects the compiler via maven-toolchains-plugin (JDK 25): register the runner's JDK
      # (packaging/toolchains.sample.xml).
      - name: Write Maven toolchains.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<XML
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>25</version></provides>
              <configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          XML

      - name: Build jar
        run: mvn -B -q -pl xdm-app -am package

      - uses: actions/upload-artifact@v7
        with:
          name: xdm-app-jar
          path: xdm-app/target/xdm-app.jar
          if-no-files-found: error

  macos:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: xdm-app-jar
          path: xdm-app/target

      - name: Pinned Liberica JDK
        run: |
          home="$(packaging/fetch-jdk.sh "mac-${{ matrix.arch }}" | tail -1)"
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"

      # No list is recorded on Intel macs: use the arm64 one (same JDK build, so the stamp matches). The
      # arm64-only JDK classes in it are skipped at dump time; the app's own classes are the same.
      - name: Borrow the arm64 class list
        if: matrix.arch == 'x64' && hashFiles('packaging/cds/mac-x64.classlist') == ''
        run: cp packaging/cds/mac-arm64.classlist packaging/cds/mac-x64.classlist

      - name: Build dmg
        run: packaging/build-bundle.sh -s --type dmg

      - uses: actions/upload-artifact@v7
        with:
          path: build/dist/*.dmg
          archive: false
          if-no-files-found: error

  windows:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: xdm-app-jar
          path: xdm-app/target

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Installs the pinned Liberica zip and the WiX 7 CLI. -AcceptWixEula accepts the WiX 7 OSMF EULA
      # (https://wixtoolset.org/osmf/) for this runner, as setup-windows.ps1 otherwise asks on a desktop.
      - name: Pinned Liberica JDK and WiX
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\setup-windows.ps1 `
            -Arch ${{ matrix.arch }} -InstallJdk -InstallWix -AcceptWixEula
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build MSI
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build-bundle.ps1 `
            -Arch ${{ matrix.arch }} -Type msi -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          path: build/dist/windows-${{ matrix.arch }}/*.msi
          archive: false
          if-no-files-found: error

  linux:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: xdm-app-jar
          path: xdm-app/target

      # Docker image with the pinned JBR (passed from packaging/jdk.properties) and nfpm.
      - name: Build packages
        run: packaging/build-linux.sh -s --arch ${{ matrix.arch }}

      # One upload per file: an unarchived artifact holds a single file (its name), so the downloads
      # aren't zips.
      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.deb
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.rpm
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.pkg.tar.zst
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.tar.gz
          archive: false
          if-no-files-found: error

  release:
    needs: [ macos, windows, linux ]
    # Windows and Linux must succeed; macOS is best effort.
    if: >-
      always() && needs.windows.result == 'success' && needs.linux.result == 'success' &&
      (github.event_name == 'push' || inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Every artifact of the run lands in dist/ (the unarchived installers as they are, the jar unzipped):
      # only the installers are published.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="$(sed -n 's/.*"currentVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            xdm-app/src/main/resources/app-version.json | head -1)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == *-* ]] && pre=true || pre=false
          else
            tag="${INPUT_TAG:-v$version-pre.$GITHUB_RUN_NUMBER}"
            pre="$INPUT_PRERELEASE"
          fi
          # SignPath Foundation requires a "Code signing policy" link on every release page.
          policy="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/master/CODE_SIGNING_POLICY.md"
          flags=(--title "XDM ${tag#v}" --generate-notes --target "$GITHUB_SHA"
            --notes "[Code signing policy]($policy)")
          [[ "$pre" == true ]] && flags+=(--prerelease) || flags+=(--latest)
          shopt -s nullglob
          files=(dist/*.dmg dist/*.msi dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.tar.gz)
          ls -l "${files[@]}"
          # A release drafted on the GitHub web page pushes its tag and already exists: just attach the files.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${files[@]}"
          else
            gh release create "$tag" "${flags[@]}" "${files[@]}"
          fi
