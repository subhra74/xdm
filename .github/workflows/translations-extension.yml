name: Extension Translations

# Validates browser extension i18n JSON files (_locales/*/messages.json):
# valid JSON format, no unknown keys, and consistent placeholders.
on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "browser-extension/_locales/**"
      - "browser-extension/tools/**"
      - ".github/workflows/translations-extension.yml"
  push:
    branches: [ "master" ]
    paths:
      - "browser-extension/_locales/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check extension language files
        run: node browser-extension/tools/check-locales.js
