# XDM overrides for FlatMacLightLaf, loaded through FlatLaf.registerCustomDefaultsSource("xdm.app.themes")
# (see AppMain.setupTheme). Palette from the XDM redesign mockup, light variant.

@background = #F5F6F8
@foreground = #17181C
@disabledForeground = #6E727B
@componentBackground = #FFFFFF

Component.borderColor = #DCDEE3
Component.linkColor = #2F5FCC
Separator.foreground = #E4E6EA
Table.background = #FFFFFF
TextField.placeholderForeground = #7A7E87

# ---- XDM main window (read through AppTheme) ----
# The design's accent, for XDM's own surfaces only (sidebar, list tiles). FlatLaf's @accentColor is left
# alone so selection, progress bars, focus rings and the default button keep their stock colors.
XDM.accent = #3B6FE0
XDM.list.background = #FFFFFF
XDM.list.titleForeground = #2E3138
XDM.list.emptyIconColor = #F0F1F4

XDM.sidebar.background = #F5F6F8
XDM.sidebar.borderColor = #E4E6EA
XDM.sidebar.foreground = #4A4E57
XDM.sidebar.selectedForeground = #17181C
XDM.sidebar.selectionBackground = #E6E9EF
XDM.sidebar.hoverBackground = #ECEEF2
XDM.sidebar.iconColor = #6B6F78
XDM.sidebar.sectionForeground = #6E727B
XDM.sidebar.countForeground = #6E727B
XDM.sidebar.selectedCountForeground = #4A4E57

# Category dots: built-ins by id, user categories pick one of the custom hues by id.
XDM.category.CAT_DOCUMENTS = #9A9EA8
XDM.category.CAT_COMPRESSED = #2E9E62
XDM.category.CAT_MUSIC = #D6962A
XDM.category.CAT_VIDEOS = #7B5BD6
XDM.category.CAT_PROGRAMS = #0E8F84
XDM.category.other = #C2457A
XDM.category.custom1 = #C2457A
XDM.category.custom2 = #2B88C8
XDM.category.custom3 = #C8641E
XDM.category.custom4 = #5E9A1E

# Download list: category tiles are the category color at tileTint % over the list background, the glyph
# that color moved tileGlyphShade % towards black.
XDM.list.tileTint = 19
# the light theme darkens the glyph so it reads on the pale tile
XDM.list.tileGlyphShade = 15
XDM.list.pausedForeground = #9A5A0C
XDM.list.pausedBackground = #F5A02829
XDM.list.failedForeground = #B42318
XDM.list.failedBackground = #E5484D24
