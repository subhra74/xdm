# XDM overrides for FlatMacDarkLaf, loaded through FlatLaf.registerCustomDefaultsSource("xdm.app.themes")
# (see AppMain.setupTheme). Palette from the XDM redesign mockup, dark variant.

@background = #16171B
@foreground = #ECEDEF
@disabledForeground = #7C808A
@componentBackground = #1A1C21
@menuBackground = #1E2026

Component.borderColor = #2A2D34
Component.linkColor = #9DB8FF
Separator.foreground = #222429
# Dialogs paint their content area (or button bar) with Table.background against the window background;
# kept well below @background so the two read as separate panels. The main list has its own XDM.list.background.
Table.background = #0C0D0F
TextField.placeholderForeground = #7C808A

# Controls: the Mac theme fills buttons, dropdowns and check boxes with 25% white over the background,
# which reads pale against this darker palette. A raised surface instead, light enough to stay visible
# on the settings cards. @buttonBackground also drives toggle buttons, spinner arrows and scrollbar thumbs.
@buttonBackground = #33353C
ComboBox.background = #33353C
CheckBox.icon[filled].background = #3A3C44

# ---- XDM main window (read through AppTheme) ----
# The design's accent, for XDM's own surfaces only (sidebar, list tiles). FlatLaf's @accentColor is left
# alone so selection, progress bars, focus rings and the default button keep their stock colors.
XDM.accent = #6E9BFF
XDM.list.background = #121316
XDM.list.titleForeground = #D2D4D9
XDM.list.emptyIconColor = #1E2026

XDM.sidebar.background = #16171B
XDM.sidebar.borderColor = #222429
XDM.sidebar.foreground = #B6B9C1
XDM.sidebar.selectedForeground = #ECEDEF
XDM.sidebar.selectionBackground = #23252B
XDM.sidebar.hoverBackground = #1E2026
XDM.sidebar.iconColor = #8E929C
XDM.sidebar.sectionForeground = #7C808A
XDM.sidebar.countForeground = #7C808A
XDM.sidebar.selectedCountForeground = #B6B9C1

# Category dots: built-ins by id, user categories pick one of the custom hues by id.
XDM.category.CAT_DOCUMENTS = #5BC08A
XDM.category.CAT_COMPRESSED = #6E9BFF
XDM.category.CAT_MUSIC = #F5B454
XDM.category.CAT_VIDEOS = #B79CFF
XDM.category.CAT_PROGRAMS = #4FD1C5
XDM.category.other = #F28FB0
XDM.category.custom1 = #F28FB0
XDM.category.custom2 = #5AB8F0
XDM.category.custom3 = #F2965A
XDM.category.custom4 = #A8D46F

# Download list: category tiles are the category color at tileTint % over the list background, the glyph
# that color moved tileGlyphShade % towards black.
XDM.list.tileTint = 22
XDM.list.tileGlyphShade = 0
XDM.list.pausedForeground = #F5B454
XDM.list.pausedBackground = #F5B45421
XDM.list.failedForeground = #F2757A
XDM.list.failedBackground = #F2757A21
# Classic list: selected row card (accent blended into the list background, across the whole row)
# and the row under the mouse.
XDM.list.selectionBackground = #1B212D
XDM.list.hoverBackground = #17181C
