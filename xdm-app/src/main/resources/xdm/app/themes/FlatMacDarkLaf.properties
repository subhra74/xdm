# XDM overrides for FlatMacDarkLaf, loaded through FlatLaf.registerCustomDefaultsSource("xdm.app.themes")
# (see AppMain.setupTheme). Everything else is the stock Mac dark theme.

# Window background and dialog content swapped from stock (#1E1E1E window, #282828 content): dialogs paint
# their content area (or button bar) with Table.background, and keeping it below @background makes the two
# read as separate panels and lets text fields stand out on it, as the main window's sidebar and list do.
@background = #282828
Table.background = #1E1E1E
# Stock derives these from @background; pinned to the stock values for its own #1E1E1E window
# (text fields, lists and scrollbar tracks; popup menus and the title bar).
@componentBackground = #282828
@menuBackground = #323232
# Stock links use the accent blue, which is hard to read on the dark grays.
Component.linkColor = #9DB8FF
# Arrows inside the field: in the Mac theme's detached "mac" stepper FlatRoundBorder forces a 0 arc,
# so the `arc` style on spinners (settings rounded()) would be ignored.
Spinner.buttonStyle = button

# ---- XDM main window (read through AppTheme) ----
# The design's accent, for XDM's own surfaces only (sidebar, list tiles). FlatLaf's @accentColor is left
# alone so selection, progress bars, focus rings and the default button keep their stock colors.
XDM.accent = #6E9BFF
XDM.list.background = #1E1E1E
XDM.list.titleForeground = #D4D4D4
XDM.list.emptyIconColor = #2C2C2C

XDM.sidebar.background = #282828
XDM.sidebar.borderColor = #000000
XDM.sidebar.foreground = #B8B8B8
XDM.sidebar.selectedForeground = #FEFEFE
XDM.sidebar.selectionBackground = #383838
XDM.sidebar.hoverBackground = #303030
XDM.sidebar.iconColor = #929292
XDM.sidebar.sectionForeground = #808080
XDM.sidebar.countForeground = #808080
XDM.sidebar.selectedCountForeground = #B8B8B8

# Category dots: built-ins by id, user categories pick one of the custom hues by id.
XDM.category.CAT_DOCUMENTS = #5BC08A
XDM.category.CAT_COMPRESSED = #6E9BFF
XDM.category.CAT_MUSIC = #F5B454
XDM.category.CAT_VIDEOS = #B79CFF
XDM.category.CAT_PROGRAMS = #4FD1C5
XDM.category.other = #F28FB0
XDM.category.custom1 = #F28FB0
XDM.category.custom2 = #5AB8F0
XDM.category.custom3 = #F2965A
XDM.category.custom4 = #A8D46F

# Download list: category tiles are the category color at tileTint % over the list background, the glyph
# that color moved tileGlyphShade % towards black.
XDM.list.tileTint = 22
XDM.list.tileGlyphShade = 0
# Paused chip: orange text on a translucent fill of the same orange.
XDM.list.pausedForeground = #F5B454
XDM.list.pausedBackground = #F5B45421
XDM.list.failedForeground = #F2757A
XDM.list.failedBackground = #F2757A21
XDM.list.seedingForeground = #5FCB7E
XDM.list.seedingBackground = #5FCB7E21
# Classic list: selected row card (a soft, low-saturation blue across the whole row)
# and the row under the mouse.
XDM.list.selectionBackground = #1E3454
XDM.list.hoverBackground = #252525
# Row subtitle (unselected): bright enough for 4.5:1 on the list and on the hover card.
XDM.list.infoForeground = #9E9E9E
# Classic list: subtitle and row button icons on the selected row, brighter so they read on the selection card.
XDM.list.selectedInfoForeground = #C8C8C8
XDM.list.selectedButtonColor = #D8D8D8
