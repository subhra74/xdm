<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Redirecting to xtremedownloadmanager.com</title>
    <script>
        // XDM 7 and 8 open this page from their menus as redirect.html?target=<name>[&version=8.0].
        // Every target goes to a page on the website, never straight to a browser store: the extension pages there
        // always carry the current store links. XDM 8 help now lives in the XDM 9 migration guide.
        var SITE = "https://xtremedownloadmanager.com";
        var MIGRATE = "/guide/update-and-migrate/";
        var PAGES = {
            "chrome": "/extension/chrome/",
            "firefox": "/extension/firefox/",
            "mzfirefox": "/extension/firefox/",
            "edge": "/extension/edge/",
            "opera": "/extension/",
            "ext": "/extension/",
            "support": "/support/",
            "issue": "/support/",
            "mg": MIGRATE,
            "video": MIGRATE,
            "helpers": MIGRATE
        };

        var target = new URLSearchParams(window.location.search).get("target") || "";
        var path = PAGES.hasOwnProperty(target) ? PAGES[target] : "/";
        window.location.replace(SITE + path + "?utm_source=xdm8" + (target ? "&from=" + encodeURIComponent(target) : ""));
    </script>
</head>

<body>
    Redirecting… If nothing happens, go to <a href="https://xtremedownloadmanager.com/">xtremedownloadmanager.com</a>.
</body>

</html>
