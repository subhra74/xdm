<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script src="i18n.js"></script>
    <script src="site-access.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="app-header">
        <h1 data-i18n="extName">XDM Integration Module</h1>
    </header>

    <div class="page-body">
        <div class="notice warn">
            <h2 data-i18n="site_access_title">Site access is restricted</h2>
            <p id="detail" data-i18n="site_access_detail">XDM needs to see the requests your browser makes to hand downloads and
                videos over to it. With access limited to some sites, or to "On click", downloads are
                left to the browser.</p>
        </div>
        <div class="button-row">
            <button class="primary-button" id="allow" type="button" data-i18n="site_access_btn_allow">Allow on all sites</button>
        </div>
    </div>
</body>

</html>
