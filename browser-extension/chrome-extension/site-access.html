<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XDM Integration Module</title>
    <script src="theme.js"></script>
    <script src="site-access.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="app-header">
        <img class="brand-icon" src="icon48.png" width="32" height="32" alt="">
        <div class="brand-copy">
            <h1>XDM</h1>
            <p>Integration Module</p>
        </div>
    </header>

    <div class="page-body">
        <div class="notice warn">
            <h2>Site access is restricted</h2>
            <p id="detail">XDM needs to see the requests your browser makes to hand downloads and
                videos over to it. With access limited to some sites, or to "On click", downloads are
                left to the browser.</p>
        </div>
        <div class="button-row">
            <button class="primary-button" id="allow" type="button">Allow on all sites</button>
        </div>
    </div>
</body>

</html>
