<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XDM Integration Module</title>
    <script src="theme.js"></script>
    <script src="error.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="app-header">
        <img class="brand-icon" src="icon48.png" width="32" height="32" alt="">
        <div class="brand-copy">
            <h1>XDM</h1>
            <p>Integration Module</p>
        </div>
    </header>

    <div class="page-body">
        <div class="notice warn" id="notice">
            <h2 id="status">XDM isn't running</h2>
            <p id="detail">Start XDM to capture downloads and videos from this page.</p>
            <p class="version-hint" id="versionHint">Works with XDM 9.0.9 and higher. Using an older
                version? <a href="https://xtremedownloadmanager.com/download/" target="_blank"
                    rel="noopener">Get the latest XDM</a>.</p>
        </div>
        <div class="button-row" id="actions">
            <button class="primary-button" id="OpenLink" type="button">Launch XDM</button>
        </div>
    </div>
</body>

</html>
