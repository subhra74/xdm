<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script src="error.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="app-header">
        <h1>XDM Integration Module</h1>
    </header>

    <div class="page-body">
        <div class="notice warn" id="notice">
            <h2 id="status">XDM isn't running</h2>
            <p id="detail">Start XDM to capture downloads and videos from this page.</p>
            <p class="version-hint" id="versionHint">Works with XDM 9.0 and higher. Using an older
                version? <a href="https://github.com/subhra74/xdm/releases" target="_blank"
                    rel="noopener">Get the latest XDM</a>.</p>
        </div>
        <div class="button-row" id="actions">
            <button class="primary-button" id="OpenLink" type="button">Launch XDM</button>
        </div>
    </div>
</body>

</html>
