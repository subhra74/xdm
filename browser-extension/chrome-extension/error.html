<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script src="i18n.js"></script>
    <script src="error.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="app-header">
        <h1 data-i18n="extName">XDM Integration Module</h1>
    </header>

    <div class="page-body">
        <div class="notice warn" id="notice">
            <h2 id="status" data-i18n="error_status_not_running">XDM isn't running</h2>
            <p id="detail" data-i18n="error_detail_not_running">Start XDM to capture downloads and videos from this page.</p>
            <p class="version-hint" id="versionHint"><span data-i18n="error_version_prefix">Works with XDM 9.0.9 and higher. Using an older
                version?</span> <a href="https://xtremedownloadmanager.com/download/" target="_blank"
                    rel="noopener" data-i18n="error_version_link">Get the latest XDM</a>.</p>
        </div>
        <div class="button-row" id="actions">
            <button class="primary-button" id="OpenLink" type="button" data-i18n="error_btn_launch">Launch XDM</button>
        </div>
    </div>
</body>

</html>
