# nginx-vod-module serving MP4 files from /media as HLS with TS segments.
#   /vod/<file>/index.m3u8            default settings (segments cut by time: vod_align_segments_to_key_frames off)
#   /vod-aligned/<file>/index.m3u8    segments aligned to keyframes
worker_processes 1;
error_log /opt/nginx/logs/error.log warn;
daemon on;
events { worker_connections 64; }
http {
    access_log off;
    vod_mode local;
    vod_segment_duration 10000;
    vod_hls_absolute_index_urls off;
    vod_hls_absolute_master_urls off;
    vod_hls_absolute_iframe_urls off;
    vod_metadata_cache metadata_cache 64m;
    server {
        listen 127.0.0.1:8080;
        location /vod/ {
            vod hls;
            alias /media/;
        }
        location /vod-aligned/ {
            vod hls;
            vod_align_segments_to_key_frames on;
            alias /media/;
        }
    }
}
