# nginx-vod-module for matrix.py: the four HLS layouts it can serve, from /media.
#   /ts/            audio+video TS, keyframe-aligned
#   /ts-unmuxed/    separate TS renditions (vod_hls_force_unmuxed_segments)
#   /fmp4/          audio+video fMP4 (vod_hls_container_format fmp4)
#   /fmp4-unmuxed/  separate fMP4 renditions
worker_processes 1;
error_log /tmp/nginx-matrix.log warn;
daemon on;
events { worker_connections 64; }
http {
    access_log off;
    vod_mode local;
    vod_segment_duration 6000;
    vod_align_segments_to_key_frames on;
    vod_hls_absolute_index_urls off;
    vod_hls_absolute_master_urls off;
    vod_hls_absolute_iframe_urls off;
    server {
        listen 127.0.0.1:8080;
        location /ts/ { vod hls; alias /media/; }
        location /ts-unmuxed/ { vod hls; vod_hls_force_unmuxed_segments on; alias /media/; }
        location /fmp4/ { vod hls; vod_hls_container_format fmp4; alias /media/; }
        location /fmp4-unmuxed/ { vod hls; vod_hls_container_format fmp4; vod_hls_force_unmuxed_segments on; alias /media/; }
    }
}
