# nfpm config for the Linux packages: deb, rpm and Arch from one app image (PACKAGING.md section 7).
# packaging/linux/package.sh fills in ARCH (amd64 / arm64; nfpm maps them to x86_64 / aarch64 for
# rpm), VERSION, and IMAGE (the jpackage app image folder, bin/xdm-app + lib/app + lib/runtime).
name: xdm-app
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Subhra Das Gupta
vendor: Subhra Das Gupta
homepage: https://xtremedownloadmanager.com
license: GPL-3.0
description: |-
  Xtreme Download Manager
  Download accelerator and video downloader: segmented downloads, HLS and DASH
  streams, batch downloads and browser integration.

contents:
  - src: ${IMAGE}
    dst: /opt/xdm-app
    type: tree
  - src: /opt/xdm-app/bin/xdm-app
    dst: /usr/bin/xdm-app
    type: symlink
  - src: packaging/linux/xdm-app.desktop
    dst: /usr/share/applications/xdm-app.desktop
  - { src: xdm-app/src/main/resources/images/xdm-logo-16.png,  dst: /usr/share/icons/hicolor/16x16/apps/xdm-app.png }
  - { src: xdm-app/src/main/resources/images/xdm-logo-24.png,  dst: /usr/share/icons/hicolor/24x24/apps/xdm-app.png }
  - { src: xdm-app/src/main/resources/images/xdm-logo-32.png,  dst: /usr/share/icons/hicolor/32x32/apps/xdm-app.png }
  - { src: xdm-app/src/main/resources/images/xdm-logo-48.png,  dst: /usr/share/icons/hicolor/48x48/apps/xdm-app.png }
  - { src: xdm-app/src/main/resources/images/xdm-logo-64.png,  dst: /usr/share/icons/hicolor/64x64/apps/xdm-app.png }
  - { src: xdm-app/src/main/resources/images/xdm-logo-128.png, dst: /usr/share/icons/hicolor/128x128/apps/xdm-app.png }
  - { src: xdm-app/src/main/resources/images/xdm-logo-256.png, dst: /usr/share/icons/hicolor/256x256/apps/xdm-app.png }
  - { src: xdm-app/src/main/resources/images/xdm-logo-512.png, dst: /usr/share/icons/hicolor/512x512/apps/xdm-app.png }
  # app/.package: the jpackage launcher reads a per-user .cfg (~/.local/xdm-app/) only when it exists,
  # and it only works where dpkg / rpm own the launcher, so deb and rpm only (PACKAGING.md 7.3, 8).
  - src: packaging/linux/package-name
    dst: /opt/xdm-app/lib/app/.package
    packager: deb
  - src: packaging/linux/package-name
    dst: /opt/xdm-app/lib/app/.package
    packager: rpm

scripts:
  preinstall: packaging/linux/preinstall.sh
  postinstall: packaging/linux/postinstall.sh
  postremove: packaging/linux/postremove.sh

# XDM 8 was packaged as xdman (deb) and xdman_gtk: installing XDM 9 removes it (PACKAGING.md 11).
replaces: [xdman, xdman_gtk]
conflicts: [xdman, xdman_gtk]

# Hard dependencies: what the runtime's AWT/X11 and font code link against (X11 is always the
# fallback). Recommended: the native Wayland toolkit's libraries (libawt_wlawt, PACKAGING.md 7.6),
# GTK 3 (FlatLaf's optional native library) and ALSA (javax.sound, unused but linked). Ubuntu 24.04
# renamed some of them with a t64 suffix, hence the alternatives.
overrides:
  deb:
    depends: [libx11-6, libxext6, libxrender1, libxtst6, libxi6, libfreetype6, fontconfig]
    recommends:
      - libwayland-client0
      - libwayland-cursor0
      - libxkbcommon0
      - libgtk-3-0t64 | libgtk-3-0
      - libasound2t64 | libasound2
  # rpm: by shared library, as rpm's own automatic dependencies are, so every rpm distro resolves
  # them whatever it names its packages (Fedora: freetype; openSUSE: libfreetype6).
  rpm:
    depends:
      - libX11.so.6()(64bit)
      - libXext.so.6()(64bit)
      - libXrender.so.1()(64bit)
      - libXtst.so.6()(64bit)
      - libXi.so.6()(64bit)
      - libfreetype.so.6()(64bit)
      - libfontconfig.so.1()(64bit)
      # At least one font: with none, Java's font setup fails ("Fontconfig head is null") and no
      # window comes up. DejaVu is dejavu-sans-fonts on Fedora/RHEL and dejavu-fonts on openSUSE (a
      # rich dependency; nfpm would split font(:lang=en) at the "="). The deb gets DejaVu through
      # fontconfig.
      - (dejavu-sans-fonts or dejavu-fonts or google-noto-sans-fonts)
    recommends:
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libgtk-3.so.0()(64bit)
      - libasound.so.2()(64bit)
  archlinux:
    # ttf-font: any font (ttf-dejavu, noto-fonts, ...), for the same reason as font(:lang=en) above.
    depends: [libx11, libxext, libxrender, libxtst, libxi, freetype2, fontconfig, ttf-font]
    recommends: [wayland, libxkbcommon, gtk3, alsa-lib]
