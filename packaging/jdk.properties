# The exact JDK builds the bundles ship, one per vendor (PACKAGING.md section 3.1).
#
# The AppCDS class lists in packaging/cds are recorded on these builds, both on the Mac: liberica.classlist on
# the Liberica below, jbr.classlist on the JBR build below for macOS (packaging/fetch-jdk.sh jbr-mac-arm64).
# Their @cp and lambda lines only hold for the JDK build they were recorded on. build-bundle.sh /
# build-bundle.ps1 refuse any other JDK (unless --any-jdk / -AnyJdk), and refuse a class list stamped with
# another build. Change a version here only together with re-recording that vendor's list
# (docs/class-list-recording.md).
#
# Read by: build-bundle.sh, build-bundle.ps1, fetch-jdk.sh, setup-windows.ps1, build-linux.sh (Dockerfile
# build args) and .github/workflows/binaries.yml. Plain key=value, no quoting.

# BellSoft Liberica JDK Standard: macOS and Windows. Checksums are BellSoft's SHA-1s
# (https://api.bell-sw.com/v1/liberica/releases?version=<version>&...).
liberica.version=25.0.5.1+5
liberica.runtime=25.0.5.1+5-LTS
liberica.mac-arm64.url=https://github.com/bell-sw/Liberica/releases/download/25.0.5.1+5/bellsoft-jdk25.0.5.1+5-macos-aarch64.tar.gz
liberica.mac-arm64.sha1=60d8880b0a0f9e1889604e55a57507b2c1989df8
liberica.mac-x64.url=https://github.com/bell-sw/Liberica/releases/download/25.0.5.1+5/bellsoft-jdk25.0.5.1+5-macos-amd64.tar.gz
liberica.mac-x64.sha1=88c0a5bc1080157794b4d3ba477c56d317dac250
liberica.windows-x64.url=https://github.com/bell-sw/Liberica/releases/download/25.0.5.1+5/bellsoft-jdk25.0.5.1+5-windows-amd64.zip
liberica.windows-x64.sha1=5620088afae9e1379a75fd7c7912386099ff633a
liberica.windows-arm64.url=https://github.com/bell-sw/Liberica/releases/download/25.0.5.1+5/bellsoft-jdk25.0.5.1+5-windows-aarch64.zip
liberica.windows-arm64.sha1=e41e82d89c8f2a6356be7fe58fc5581b2d88aef0

# JetBrains Runtime jbrsdk: Linux (its java.desktop has the native Wayland toolkit, PACKAGING.md section 7.6),
# and its macOS build on the Mac, only to record jbr.classlist.
# The Docker image downloads it from cache-redirector.jetbrains.com and checks JetBrains' SHA-512.
jbr.version=25.0.4.1
jbr.build=b635.70
