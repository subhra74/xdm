# The exact JDK builds the bundles ship, one per vendor (PACKAGING.md section 3.1).
#
# The AppCDS class lists in packaging/cds are recorded on these builds: their @cp and lambda lines only hold
# for the JDK build they were recorded on. build-bundle.sh / build-bundle.ps1 refuse any other JDK (unless
# --any-jdk / -AnyJdk), and refuse a class list stamped with another build. Change a version here only
# together with re-recording the lists of the targets that use it (docs/class-list-recording.md).
#
# Read by: build-bundle.sh, build-bundle.ps1, fetch-jdk.sh, setup-windows.ps1, build-linux.sh (Dockerfile
# build args) and .github/workflows/binaries.yml. Plain key=value, no quoting.

# BellSoft Liberica JDK Standard: macOS and Windows. Checksums are BellSoft's SHA-1s
# (https://api.bell-sw.com/v1/liberica/releases?version=<version>&...).
liberica.version=25.0.4.1+1
liberica.runtime=25.0.4.1+1-LTS
liberica.mac-arm64.url=https://github.com/bell-sw/Liberica/releases/download/25.0.4.1+1/bellsoft-jdk25.0.4.1+1-macos-aarch64.tar.gz
liberica.mac-arm64.sha1=48b4888e440ee82ea6f023dde840e3dcac395609
liberica.mac-x64.url=https://github.com/bell-sw/Liberica/releases/download/25.0.4.1+1/bellsoft-jdk25.0.4.1+1-macos-amd64.tar.gz
liberica.mac-x64.sha1=d727bb63bee69f1a01618b45b4a9852570829447
liberica.windows-x64.url=https://github.com/bell-sw/Liberica/releases/download/25.0.4.1+1/bellsoft-jdk25.0.4.1+1-windows-amd64.zip
liberica.windows-x64.sha1=841be12d9058794e067d206f4cd36a4056d4ca3a
liberica.windows-arm64.url=https://github.com/bell-sw/Liberica/releases/download/25.0.4.1+1/bellsoft-jdk25.0.4.1+1-windows-aarch64.zip
liberica.windows-arm64.sha1=cc68198d94a23a0d77dc072a9808d2f04c9ebb69

# JetBrains Runtime jbrsdk: Linux (its java.desktop has the native Wayland toolkit, PACKAGING.md section 7.6).
